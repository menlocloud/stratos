name: helm

# Chart release for deploy/chart — tag-driven, unified with the image tags:
#   - PR (chart paths): lint + template only.
#   - push tag v*:      package the chart at that version (v0.1.2 -> 0.1.2) and
#                       push to oci://ghcr.io/<owner>/charts. Idempotent: skips
#                       if that chart version is already in the registry.
#
# The git tag is the single source of truth for the released version — the app
# images and the chart share the same vX.Y.Z tag. Chart.yaml `version:` is only a
# local/dev default; the tag overrides it at package time.
on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
    paths:
      - 'deploy/chart/**'
      - 'deploy/charts/**'

env:
  CHART_DIR: deploy/chart
  CHART_NAME: stratos
  OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  # The Managed Kubernetes cluster chart (deploy/charts) is versioned by its own Chart.yaml, not by
  # the release tag, and goes to its own OCI path so it never collides with the copy of the same
  # chart published from menlocloud/charts for the infra-ops wrappers. See deploy/charts/README.md.
  K8S_CHART_DIR: deploy/charts/openstack-kamaji-cluster
  K8S_CHART_NAME: openstack-kamaji-cluster
  K8S_OCI_REPO: oci://ghcr.io/${{ github.repository_owner }}/stratos-charts

jobs:
  # ---- PR: sanity only ------------------------------------------------------
  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: ghcr login (for OCI helm deps)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Lint + template
        run: |
          set -euo pipefail
          # dependency build resolves the classic (non-OCI) repos only if they are configured
          helm repo add codecentric https://codecentric.github.io/helm-charts
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm dependency build "$CHART_DIR"
          helm lint "$CHART_DIR"
          helm template "$CHART_DIR" -f "$CHART_DIR/values-dev.yaml" >/dev/null

      - name: Lint + template the managed-k8s cluster chart
        run: |
          set -euo pipefail
          helm dependency build "$K8S_CHART_DIR"
          helm lint "$K8S_CHART_DIR"
          # Bare defaults must render: it is the only cheap guard on the chart's own consistency.
          helm template test "$K8S_CHART_DIR" >/dev/null

  # ---- tag v*: package + publish the chart at the tag version (idempotent) ---
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the OCI chart artifact
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: ghcr login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package + publish chart at the tag version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"          # v0.1.2 -> 0.1.2
          if helm show chart "$OCI_REPO/$CHART_NAME" --version "$version" >/dev/null 2>&1; then
            echo "chart $CHART_NAME $version already published — nothing to do."
            exit 0
          fi
          # dependency build resolves the classic (non-OCI) repos only if they are configured
          helm repo add codecentric https://codecentric.github.io/helm-charts
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm dependency build "$CHART_DIR"
          helm lint "$CHART_DIR"
          helm template "$CHART_DIR" -f "$CHART_DIR/values-dev.yaml" >/dev/null
          # app-version keeps the v prefix: it is the image tag the templates fall back to,
          # and the docker workflow tags images with the tag name verbatim (v0.1.0).
          helm package "$CHART_DIR" -d /tmp/pkg --version "$version" --app-version "$GITHUB_REF_NAME"
          helm push "/tmp/pkg/$CHART_NAME-$version.tgz" "$OCI_REPO"

      - name: Package + publish the managed-k8s cluster chart at ITS OWN version
        run: |
          set -euo pipefail
          # Deliberately NOT the release tag: a customer cluster pins a chart version and keeps it
          # until something moves it, so the chart's lifecycle is its own. Bump Chart.yaml in the
          # PR that changes the chart; this step is a no-op until you do.
          version="$(helm show chart "$K8S_CHART_DIR" | awk '/^version:/ {print $2}')"
          if helm show chart "$K8S_OCI_REPO/$K8S_CHART_NAME" --version "$version" >/dev/null 2>&1; then
            echo "chart $K8S_CHART_NAME $version already published — nothing to do."
            exit 0
          fi
          helm dependency build "$K8S_CHART_DIR"
          helm lint "$K8S_CHART_DIR"
          helm template test "$K8S_CHART_DIR" >/dev/null
          helm package "$K8S_CHART_DIR" -d /tmp/pkg
          helm push "/tmp/pkg/$K8S_CHART_NAME-$version.tgz" "$K8S_OCI_REPO"
