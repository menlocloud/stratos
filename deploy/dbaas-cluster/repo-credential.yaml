# ArgoCD repository credential for the chart registry (same registry, same mechanics as
# deploy/mgmt-cluster/repo-credential.yaml — this copy exists because the DBaaS cluster runs
# its own ArgoCD).
#
# The chart package on GHCR is PRIVATE (that is the default for a newly pushed package, and the
# posture we want while the release is internal-first). Without this Secret every stratos
# Application parks in ComparisonError with a 401/403 from the registry, and nothing in the stratos
# UI explains why — the failure is entirely on the ArgoCD side.
#
# Make the package public instead and you can skip this file. There is no REST endpoint for that;
# it is Organization → Packages → stratos-charts/database-cluster → Package settings →
# Change visibility.
#
# ---------------------------------------------------------------------------------------------
# `url` MUST match `config.argocd.chartRepo` in the stratos provider AND the AppProject's
# sourceRepos entry, character for character — ArgoCD matches credentials by URL prefix, and a
# stray `oci://` on one side silently fails to match, which looks exactly like a bad password.
# Everything in this repo uses the bare host/path form.
#
# The credential itself: a GitHub PAT (classic) with `read:packages`, or a fine-grained token with
# read access to the org's packages. Give it to a machine user if you have one — this token lives
# in the DBaaS cluster and is only ever used to pull charts.
#
#   kubectl -n argocd create secret generic stratos-charts-creds \
#     --from-literal=type=helm \
#     --from-literal=name=stratos-charts \
#     --from-literal=url=ghcr.io/menlocloud/stratos-charts \
#     --from-literal=enableOCI=true \
#     --from-literal=username='<github-username>' \
#     --from-literal=password='<PAT with read:packages>' \
#   && kubectl -n argocd label secret stratos-charts-creds \
#     argocd.argoproj.io/secret-type=repository
#
# The manifest below is the same thing, declarative. DO NOT COMMIT A FILLED-IN COPY — run it
# through your secret tooling (External Secrets / SealedSecrets / ESC) or use the imperative form
# above.
---
apiVersion: v1
kind: Secret
metadata:
  name: stratos-charts-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: helm
  name: stratos-charts
  url: ghcr.io/menlocloud/stratos-charts
  # OCI has to be opted into explicitly; a Helm repo entry without it is treated as a classic
  # index.yaml repo and fails with a confusing "looks like it is not a valid chart repository".
  enableOCI: "true"
  username: __GITHUB_USERNAME__
  password: __GITHUB_READ_PACKAGES_PAT__
