# Custom ArgoCD health checks for the operator CRDs the database-cluster chart renders
# (ArgoCD has NO built-in health for CNPG Cluster / PerconaServerMySQL / MariaDB — without
# these, every customer-database Application reports Healthy the moment manifests apply, long
# before the database exists, and the stratos status mapping (Argo health → DB status,
# internal/cloud/dbaas/syncprovider.go) would be meaningless. The LB Service and the FerretDB
# frontend Deployment ride ArgoCD's BUILT-IN Service/Deployment health — no Lua needed there;
# the Service health is what keeps an Application Progressing until the Octavia VIP exists).
#
# This file is a MERGE PATCH for the existing argocd-cm, not a standalone ConfigMap — ArgoCD
# owns argocd-cm and a plain `kubectl apply` of this partial object would wipe its other keys
# if applied with --prune or SSA-force. Apply with:
#
#   kubectl -n argocd patch configmap argocd-cm --type merge --patch-file argocd-health.yaml
#
# (If argocd-cm is itself GitOps-managed, fold the data keys into that source instead.)
#
# ⚠ NO LUA STANDARD LIBRARY. ArgoCD's sandbox does not expose `string` (nor `os`/`io`): a check
# that calls string.lower/string.find dies with "attempt to index a non-table object(nil)", the
# resource's health becomes Unknown, and the Application's health follows — which reads as "fine"
# on a database that has nothing running. Compare status values by equality/table lookup instead.
#
# ⚠ VALIDATE DURING THE LIVE DRILL: the status fields below are taken from the upstream CRD
# sources (CNPG cluster_types.go phase strings, ps-operator status.state, mariadb-operator
# Ready condition) — but the exact value sets on OUR pinned operator versions
# (deploy/dbaas-cluster/README.md) must be confirmed against a real database of each engine
# before trusting READY.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  # CloudNativePG Cluster (also the FerretDB backend <id>-pg): Healthy only when every
  # requested instance is ready AND the operator's phase rollup says healthy. Phase is a
  # free-ish string, so failure detection is a phrase heuristic — anything transitional
  # (Setting up primary / Creating replica / Upgrading / Failing over / Switchover) stays
  # Progressing.
  resource.customizations.health.postgresql.cnpg.io_Cluster: |
    hs = {}
    -- NO string library: ArgoCD's Lua sandbox does not expose it, and calling string.lower here
    -- crashed the check — every CNPG database then reported health Unknown, which is how a
    -- database with no pods still looked fine. Match the operator's phase values exactly.
    local healthy = "Cluster in healthy state"
    local broken = {
      ["Cluster in unrecoverable state"] = true,
      ["Cluster upgrade failed"] = true,
      ["Failing over"] = false,
    }
    if obj.status ~= nil then
      local phase = obj.status.phase
      if phase ~= nil and broken[phase] then
        hs.status = "Degraded"
        hs.message = phase
        return hs
      end
      local desired = nil
      if obj.spec ~= nil then
        desired = obj.spec.instances
      end
      local ready = obj.status.readyInstances or 0
      if desired ~= nil and ready >= desired and phase == healthy then
        hs.status = "Healthy"
        hs.message = tostring(ready) .. " ready"
        return hs
      end
      hs.status = "Progressing"
      hs.message = tostring(ready) .. "/" .. tostring(desired) .. " ready — " .. tostring(phase)
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for Cluster status"
    return hs

  # Percona Server for MySQL: status.state is the operator's own rollup
  # ("initializing" → "ready"; "error" degraded; "paused"/"stopping" treated as in-flight).
  resource.customizations.health.ps.percona.com_PerconaServerMySQL: |
    hs = {}
    if obj.status ~= nil and obj.status.state ~= nil then
      local state = obj.status.state
      if state == "ready" then
        hs.status = "Healthy"
        hs.message = "PerconaServerMySQL ready"
        return hs
      end
      if state == "error" then
        hs.status = "Degraded"
        hs.message = "PerconaServerMySQL error"
        return hs
      end
      hs.status = "Progressing"
      hs.message = "PerconaServerMySQL " .. tostring(state)
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for PerconaServerMySQL status"
    return hs

  # mariadb-operator MariaDB: the Ready condition is the operator's rollup. False stays
  # Progressing (the condition is False during normal init and the operator does not expose a
  # clean terminal-failure signal — a stuck DB parks Progressing, which stratos surfaces as a
  # never-READY database rather than a false READY).
  resource.customizations.health.k8s.mariadb.com_MariaDB: |
    hs = {}
    if obj.status ~= nil and obj.status.conditions ~= nil then
      for _, c in ipairs(obj.status.conditions) do
        if c.type == "Ready" then
          if c.status == "True" then
            hs.status = "Healthy"
            hs.message = c.message or "MariaDB ready"
            return hs
          end
          hs.status = "Progressing"
          hs.message = c.message or ("MariaDB " .. tostring(c.reason))
          return hs
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for MariaDB status"
    return hs

  # Valkey — PLACEHOLDER, deliberately commented out: the operator CRD is unpinned (see
  # deploy/charts/database-cluster/templates/valkey/valkey.yaml header). Uncomment, correct
  # the group/kind and the status shape, and validate before the valkey beta gate opens.
  # TODO-verify(beta):
  #
  # resource.customizations.health.hyperspike.io_Valkey: |
  #   hs = {}
  #   if obj.status ~= nil and obj.status.ready ~= nil then
  #     if obj.status.ready then
  #       hs.status = "Healthy"
  #       hs.message = "Valkey ready"
  #       return hs
  #     end
  #   end
  #   hs.status = "Progressing"
  #   hs.message = "Waiting for Valkey status"
  #   return hs

  # Strimzi Kafka: the Ready/NotReady conditions are the operator's rollup, but they are
  # only meaningful for the CURRENT spec — a stale Ready from before a spec change would
  # flash Healthy mid-reconcile, so gate on status.observedGeneration first. Warnings
  # (e.g. an unknown config key) also surface as conditions; only NotReady degrades.
  # ⚠ VALIDATE-AT-DRILL: condition set confirmed against Strimzi docs, not yet against a
  # live 1.1.0 cluster.
  resource.customizations.health.kafka.strimzi.io_Kafka: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.observedGeneration ~= nil and obj.metadata ~= nil and obj.metadata.generation ~= nil and obj.status.observedGeneration < obj.metadata.generation then
        hs.status = "Progressing"
        hs.message = "Waiting for Strimzi to observe generation " .. tostring(obj.metadata.generation)
        return hs
      end
      if obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "NotReady" and c.status == "True" then
            hs.status = "Degraded"
            hs.message = tostring(c.reason or "NotReady") .. ": " .. tostring(c.message or "")
            return hs
          end
          if c.type == "Ready" and c.status == "True" then
            hs.status = "Healthy"
            hs.message = "Kafka ready"
            return hs
          end
        end
      end
    end
    hs.status = "Progressing"
    hs.message = "Waiting for Kafka status"
    return hs

  # opensearch-k8s-operator OpenSearchCluster: NO conditions on this CRD — status.health
  # mirrors the cluster health API (green/yellow/red). yellow stays Progressing (normal
  # during shard allocation on create/scale; a stuck-yellow cluster parks Progressing and
  # surfaces as never-READY, same posture as MariaDB above), red degrades.
  # ⚠ VALIDATE-AT-DRILL: field shape taken from operator 3.x sources; ALSO the api group —
  # the chart renders opensearch.opster.io/v1 (deprecated, 3.x is migrating to
  # opensearch.org; see the chart's opensearchcluster.yaml header). ArgoCD keys health
  # checks by GROUP_Kind: if the chart ever moves to opensearch.org, duplicate this block
  # under resource.customizations.health.opensearch.org_OpenSearchCluster.
  resource.customizations.health.opensearch.opster.io_OpenSearchCluster: |
    hs = {}
    if obj.status ~= nil and obj.status.health ~= nil and obj.status.health ~= "" then
      local health = obj.status.health
      if health == "green" then
        hs.status = "Healthy"
        hs.message = "OpenSearch cluster green"
        return hs
      end
      if health == "yellow" then
        hs.status = "Progressing"
        hs.message = "OpenSearch cluster yellow (shard allocation in progress)"
        return hs
      end
      if health == "red" then
        hs.status = "Degraded"
        hs.message = "OpenSearch cluster red"
        return hs
      end
      hs.status = "Progressing"
      hs.message = "OpenSearch cluster health " .. tostring(health)
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Waiting for OpenSearchCluster status"
    return hs
