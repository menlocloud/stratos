{{/*
Per-database NetworkPolicy. The stdb-<projectId> namespace gets an ingress
default-deny ("stratos-default-deny") stamped by stratos when it ensures the
namespace (dbaas.Service.EnsureProjectNamespace — NOT by this chart, whose
releases share the namespace and would collide on the policy name); this
policy is the additive allow for one database's pods. That namespace holds
databases ONLY — the stdb- prefix exists so the namespace-wide deny cannot
reach the Managed-Kubernetes product's pods on the same cluster.

WHY allowedCidrs ARE NOT MIRRORED HERE: client filtering is enforced at the
Octavia LB (spec.loadBalancerSourceRanges on the <id>-lb Service = the Octavia
ACL). By the time traffic reaches a pod it has been proxied by the amphora —
the source address is an amphora port on the member subnet (or a node address
after kube-proxy), never the client CIDR. Mirroring allowedCidrs here would
therefore block ALL legitimate traffic. Do not "fix" that.

ponytail: the DB-port rule below is source-open (in-cluster pods from other
namespaces could reach the port too, gated only by DB auth) because the
amphora/member-subnet and node CIDRs are not knowable to the chart. Ceiling:
add a network.clusterCidrs value and pin ipBlocks here if in-cluster reach
ever matters.
*/}}
{{- $name := include "database-cluster.name" . }}
{{- $port := include "database-cluster.port" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
spec:
  # app.kubernetes.io/instance is stamped on every pod of this database: by
  # CNPG inheritedMetadata (postgresql / the ferretdb backend), by the
  # operators' CR-name-as-instance convention (mysql / mariadb / valkey —
  # TODO-verify(beta) for valkey), and by the chart's own Deployments
  # (mariadb haproxy / ferretdb frontend). EXCEPTIONS — operators that stamp
  # their own cluster label instead: kafka (strimzi.io/cluster) and opensearch
  # (opster.io/opensearch-cluster; TODO-verify(drill): Dashboards pods carry
  # opensearch.cluster.dashboards, NOT necessarily the cluster label — if the
  # drill shows the dash pods outside this selector, the namespace
  # default-deny blocks the <id>-dash-lb and the selector below needs an OR
  # via a second policy).
  podSelector:
    matchLabels:
      {{- if eq .Values.engine "kafka" }}
      strimzi.io/cluster: {{ $name }}
      {{- else if eq .Values.engine "opensearch" }}
      opster.io/opensearch-cluster: {{ $name }}
      {{- else }}
      app.kubernetes.io/instance: {{ $name }}
      {{- end }}
  policyTypes:
    - Ingress
  ingress:
    # 1. Client traffic on the engine port(s), arriving via the Octavia LB
    #    (amphora member-subnet source) or node SNAT. Source-open by design —
    #    see header.
    #    opensearch: 9200 client HTTPS, 9300 transport, 5601 Dashboards (via
    #    the <id>-dash-lb). kafka: 9092 internal listener, 9093 (reserved,
    #    Strimzi's conventional TLS listener port), 9094 external listener
    #    (per-broker + bootstrap LBs), 9090/9091 control-plane/replication.
    #    ponytail: intra-cluster ports (9300, 9090/9091) ride this source-open
    #    rule too instead of a tighter peer-only rule — rule 2 already allows
    #    them peer-to-peer; listing them here only widens to in-cluster
    #    sources, same known ceiling as the header describes.
    - ports:
        {{- if eq .Values.engine "opensearch" }}
        - port: 9200
          protocol: TCP
        - port: 9300
          protocol: TCP
        - port: 5601
          protocol: TCP
        {{- else if eq .Values.engine "kafka" }}
        - port: 9090
          protocol: TCP
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 9094
          protocol: TCP
        {{- else }}
        - port: {{ $port }}
          protocol: TCP
        {{- end }}
    # 2. Intra-instance traffic on ALL ports: replication (PG streaming,
    #    MySQL GR 33061/33060, MariaDB replication, valkey gossip, opensearch
    #    transport 9300, kafka controller/replication 9090/9091) plus the
    #    engines' own status probes.
    - from:
        - podSelector:
            matchLabels:
              {{- if eq .Values.engine "kafka" }}
              strimzi.io/cluster: {{ $name }}
              {{- else if eq .Values.engine "opensearch" }}
              opster.io/opensearch-cluster: {{ $name }}
              {{- else }}
              app.kubernetes.io/instance: {{ $name }}
              {{- end }}
    # 3. Operator + monitoring namespaces: reconciliation probes (e.g. CNPG
    #    instance manager on 8000) and metrics scrapes. Names must match the
    #    operator install in deploy/dbaas-cluster/README.md — adjust there and
    #    here together if ops picks different namespaces.
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - cnpg-system
                  - ps-operator
                  - mariadb-operator
                  - valkey-operator-system
                  - opensearch-operator-system
                  - strimzi-system
                  - monitoring
