{{- $name := include "database-cluster.name" . }}
apiVersion: hyperspike.io/v1
kind: Valkey
metadata:
  name: {{ $name }}
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
spec:
  nodes: {{ int .Values.instances }}
  image: {{ include "database-cluster.image" . }}
  tls: false
  prometheus: {{ .Values.monitoring.enabled }}
  resources:
    {{- include "database-cluster.resources" . | nindent 4 }}
  storage:
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- with .Values.storage.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.storage.sizeGi }}Gi
{{- end }}
