{{- if eq .Values.engine "mysql" }}
{{/*
Percona Server for MySQL (ps-operator), group replication. The operator
provisions users and maintains the <id>-secrets Secret (root/operator/...
passwords) — the tuple internal/cloud/dbaas/engines.go reads.

TODO-verify(drill): the SERVED CRD version on the pinned operator —
v1alpha1 is current as of authoring, but ps-operator has been trending
toward v1; `kubectl api-resources | grep ps.percona.com` before first sync.
Also verify the haproxy image tag against the operator's compatibility list.

restartedAt is NOT wired for mysql: the Percona CR has no documented
restart-annotation mechanism, so the RESTART capability stays off for this
engine (internal/cloud/dbaas/engines.go Capabilities) until one is live-verified.
*/}}
{{- $name := include "database-cluster.name" . }}
apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: {{ $name }}
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
spec:
  # crVersion deliberately omitted: the operator defaults it to its own
  # version, which keeps the chart from hard-pinning an operator release.
  # Pinned explicitly = the connection-secret contract (also the operator default).
  secretsName: {{ $name }}-secrets
  {{- if lt (int .Values.instances) 3 }}
  # Group replication formally needs 3 nodes; a 1-node database is a
  # deliberate dev/small offering and requires the operator's unsafe override.
  # The stratos catalog only offers 1|3 (mysql GR risk note in the plan).
  unsafeFlags:
    mysqlSize: true
  {{- end }}
  {{- if include "database-cluster.backupEnabled" . }}
  {{/*
  Percona backups: xtrabackup/xbcloud driven by a sidecar in the mysql pod.
  Unlike CNPG and mariadb there is no separate storage CR — the object store is
  declared inline on this CR and referenced by NAME from the schedule and from
  every PerconaServerMySQLBackup.

  *** endpointUrl, NOT endpointURL. *** The CRD field is lower-case `url`;
  docs.percona.com writes `endpointURL` on its PITR page. A CRD PRUNES unknown
  fields silently, so the capital-U spelling does not error — the field simply
  vanishes, no --s3-endpoint is passed, and xbcloud uploads to real AWS S3 with
  these credentials. Do not "fix" the casing.

  verifyTLS is a SIBLING of s3, not a member of it (the docs example nests it,
  which would also be pruned).
  */}}
  backup:
    enabled: true
    # REQUIRED by the operator (CheckNSetDefaults rejects the CR without it).
    image: {{ include "database-cluster.mysqlBackupImage" . }}
    {{/* The binlog server streams binlogs to the same object store; without it
         a restore can only land on a backup boundary, never a chosen second. */}}
    pitr:
      enabled: true
    storages:
      stratos:
        type: s3
        verifyTLS: {{ include "database-cluster.backupTLS" . }}
        s3:
          bucket: {{ .Values.backup.s3.bucket | quote }}
          prefix: {{ printf "%s/%s" (.Values.backup.s3.prefix | default "stratos") (include "database-cluster.name" .) | quote }}
          endpointUrl: {{ .Values.backup.s3.endpoint | quote }}
          {{- with .Values.backup.s3.region }}
          region: {{ . | quote }}
          {{- end }}
          credentialsSecret: {{ .Values.backup.s3.credsSecret }}
        containerOptions:
          {{/* Percona exposes no compression enum — it is an xtrabackup flag.
               zstd is the fast-both-ways choice, and an uncompressed physical
               backup is the expensive default nobody notices until a restore. */}}
          args:
            xtrabackup:
              - "--compress=zstd"
          {{- if .Values.backup.s3.pathStyle }}
          env:
            # RGW is path-style; xbcloud defaults to bucket-lookup auto, which
            # tries the virtual-host form first.
            - name: XBCLOUD_EXTRA_ARGS
              value: "--s3-bucket-lookup=path"
          {{- end }}
    {{- with .Values.backup.schedule }}
    schedule:
      - name: stratos-scheduled
        schedule: {{ . | quote }}
        storageName: stratos
        {{- with $.Values.backup.keepBackups }}
        {{/* Percona counts BACKUPS, not days — stratos converts the customer's
             retention in days into a count using the schedule's cadence
             (values.go keepBackups), because the two only coincide at a daily
             cron. `keep` belongs on the FULL entry alone: retention applies to
             the whole chain, and Percona does not support a retention policy
             on increments. */}}
        keep: {{ int . }}
        {{- end }}
        type: full
      {{- with $.Values.backup.incrementalSchedule }}
      {{/* Increments on the days the base does not run. They chain onto the
           latest full — the operator picks the base automatically — so pruning
           a full takes its increments with it and never orphans one. This is
           what keeps a weekly full affordable AND the binlog replay short. */}}
      - name: stratos-incremental
        schedule: {{ . | quote }}
        storageName: stratos
        type: incremental
      {{- end }}
    {{- end }}
  {{- end }}
  mysql:
    clusterType: group-replication
    size: {{ int .Values.instances }}
    image: {{ include "database-cluster.image" . }}
    {{- include "database-cluster.podPlacement" . | nindent 4 }}
    resources:
      {{- include "database-cluster.resources" . | nindent 6 }}
    {{- with .Values.mysql.parameters }}
    configuration: |
      [mysqld]
      {{- range $k, $v := . }}
      {{ $k }}={{ $v }}
      {{- end }}
    {{- end }}
    volumeSpec:
      persistentVolumeClaim:
        {{- with .Values.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.sizeGi }}Gi
  proxy:
    {{/*
    router MUST be present, even disabled. The operator's CEL validation reads
    spec.proxy.router unconditionally for group-replication clusters and the
    admission webhook rejects the whole object with
      "no such key: router evaluating rule: ... Router size must be 2 or greater"
    when the key is absent — the cluster is never created. Declaring it disabled
    satisfies the lookup and keeps HAProxy as the single proxy (the two are
    mutually exclusive, and the LB selector targets haproxy pods).
    */}}
    router:
      enabled: false
    # The LB Service selects these haproxy pods (write port 3306 routed to the
    # GR primary). 2 proxies when the DB itself is HA, else 1.
    haproxy:
      enabled: true
      size: {{ gt (int .Values.instances) 1 | ternary 2 1 }}
      {{- include "database-cluster.podPlacement" . | nindent 6 }}
      # TODO-verify(drill): tag from the pinned operator's compatibility list.
      image: docker.io/percona/haproxy:2.8.11
      resources:
        requests:
          cpu: {{ .Values.mysql.haproxy.cpu | quote }}
          memory: {{ .Values.mysql.haproxy.memoryGi }}Gi
        limits:
          cpu: {{ .Values.mysql.haproxy.cpu | quote }}
          memory: {{ .Values.mysql.haproxy.memoryGi }}Gi
  # Orchestrator is the async-replication failover manager — not used with
  # group replication.
  orchestrator:
    enabled: false
{{- end }}
