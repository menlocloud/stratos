{{- if eq .Values.engine "mariadb" }}
{{/*
Chart-owned HAProxy for MariaDB — the pods the <id>-lb Service selects. Why it
exists: unlike Percona (which ships its own haproxy component), mariadb-operator
exposes the primary through a Service whose endpoint is pinned to a pod NAME,
so there is no stable pod label the Octavia LB Service could select. This tiny
TCP proxy is that stable target; it follows the operator's primary Service via
runtime DNS (see haproxy-configmap.yaml).
*/}}
{{- $name := include "database-cluster.name" . }}
{{/* A single-instance DB gets a single proxy — HA proxies for a non-HA
     database is cargo. */}}
{{- $replicas := gt (int .Values.instances) 1 | ternary (int .Values.mariadb.haproxy.replicas) 1 }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-haproxy
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/name: mariadb-haproxy
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb-haproxy
      app.kubernetes.io/instance: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb-haproxy
        app.kubernetes.io/instance: {{ $name }}
      annotations:
        # Roll the proxies when the config changes.
        checksum/config: {{ include (print $.Template.BasePath "/mariadb/haproxy-configmap.yaml") . | sha256sum }}
        {{- with .Values.restartedAt }}
        kubectl.kubernetes.io/restartedAt: {{ . | quote }}
        {{- end }}
    spec:
      containers:
        - name: haproxy
          image: {{ .Values.mariadb.haproxy.image }}
          args: ["-f", "/usr/local/etc/haproxy/haproxy.cfg"]
          ports:
            - name: mariadb
              containerPort: 3306
              protocol: TCP
            {{- if and .Values.network.readEndpoint (gt (int .Values.instances) 1) }}
            - name: mariadb-ro
              containerPort: 3307
              protocol: TCP
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.mariadb.haproxy.cpu | quote }}
              memory: {{ .Values.mariadb.haproxy.memoryGi }}Gi
            limits:
              cpu: {{ .Values.mariadb.haproxy.cpu | quote }}
              memory: {{ .Values.mariadb.haproxy.memoryGi }}Gi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-haproxy
{{- end }}
