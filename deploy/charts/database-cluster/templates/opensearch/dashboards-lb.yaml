{{- if and (eq .Values.engine "opensearch") .Values.opensearch.dashboards.enabled }}
{{/*
Optional SECOND chart-owned LB <id>-dash-lb: the Dashboards UI on 5601, same
Octavia internal-LB wiring (and the same allowedCidrs ACL) as the main
<id>-lb in service-lb.yaml. TCP passthrough — Dashboards serves its own
operator-generated TLS (spec.dashboards.tls in opensearchcluster.yaml).

The cluster label is opensearch.org/*, not opster.io/*: on operator 3.0.2 the
labels moved with the api group (drill-verified off a live node pod, which
carries no opster.io key at all — the same mistake made the NetworkPolicy
select nothing and kept the cluster from forming).

STILL TODO-verify(drill): whether the Dashboards pods carry the CLUSTER label
at all, or only opensearch.cluster.dashboards. Dashboards were off in the
2026-08-06 drill, so this pair is unverified — if the dash pods do not carry
the cluster label, drop that line and select on the dashboards label alone, and
re-check the NetworkPolicy podSelector caveat in templates/networkpolicy.yaml
(outside that selector, the namespace default-deny blocks <id>-dash-lb).
*/}}
{{- $name := include "database-cluster.name" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-dash-lb
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
    loadbalancer.openstack.org/network-id: {{ .Values.network.networkId | quote }}
    loadbalancer.openstack.org/subnet-id: {{ .Values.network.subnetId | quote }}
    loadbalancer.openstack.org/member-subnet-id: {{ .Values.network.memberSubnetId | quote }}
    # Internal LB — see the annotation note in service-lb.yaml.
    service.beta.kubernetes.io/openstack-internal-load-balancer: "true"
    {{- if .Values.network.dnsZone }}
    external-dns.alpha.kubernetes.io/hostname: {{ printf "%s-dash.%s" $name .Values.network.dnsZone }}
    {{- end }}
    {{- with .Values.network.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.network.allowedCidrs }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: dashboards
      port: 5601
      targetPort: 5601
      protocol: TCP
  selector:
    opensearch.org/opensearch-cluster: {{ $name }}
    opensearch.cluster.dashboards: {{ $name }}
{{- end }}
