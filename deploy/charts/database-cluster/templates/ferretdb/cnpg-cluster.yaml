{{- if eq .Values.engine "ferretdb" }}
{{/*
FerretDB v2 backend: a CNPG Cluster <id>-pg running FerretDB's
postgres-documentdb image (PostgreSQL with the Microsoft DocumentDB extension
baked in — plain postgres images DO NOT work, the extension is a hard
requirement and ships only in matched image pairs with the frontend).

The operator maintains the <id>-pg-app Secret; the frontend Deployment
(deployment.yaml next to this file) builds FERRETDB_POSTGRESQL_URL from it.
That Secret is also the ConnectionSecret tuple internal/cloud/dbaas/engines.go
reads — customers authenticate to FerretDB with the same app credentials.
*/}}
{{- $name := include "database-cluster.name" . }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $name }}-pg
  labels:
    {{- include "database-cluster.labels" . | nindent 4 }}
  annotations:
    {{- include "database-cluster.annotations" . | nindent 4 }}
    {{- with .Values.restartedAt }}
    # Same CNPG restart mechanism as templates/postgresql/cluster.yaml.
    kubectl.kubernetes.io/restartedAt: {{ . | quote }}
    {{- end }}
spec:
  instances: {{ int .Values.instances }}
  imageName: {{ .Values.ferretdb.postgresImage }}
  # The postgres user in the FerretDB image is uid/gid 999 (it is built on the
  # official postgres image), NOT the 26/26 CNPG assumes for its OWN images.
  # Without this, initdb dies at bootstrap with
  #   "initdb: could not look up effective user ID 26: user does not exist"
  # and the Job retries forever. IMMUTABLE after creation — a database created
  # by an older chart cannot be repaired in place, it must be recreated.
  postgresUID: 999
  postgresGID: 999
  # DocumentDB requirements, taken verbatim from the image's own bootstrap
  # scripts (/docker-entrypoint-initdb.d/10-preload.sh + 20-install.sql), which
  # CNPG never runs — it does not use the image entrypoint, so everything those
  # scripts would have written into postgresql.conf must live here instead.
  #
  # pg_cron is LOAD-BEARING, not optional: documentdb.control declares
  #   requires = 'documentdb_core, pg_cron, tsm_system_rows, vector, postgis, rum'
  # so the CASCADE below creates pg_cron too — and pg_cron refuses to be created
  # in any database other than cron.database_name. That is why the setting names
  # the CNPG APP database (the one the frontend connects to, deployment.yaml),
  # not the image default of `postgres`. Order matters: pg_cron first.
  postgresql:
    shared_preload_libraries:
      - pg_cron
      - pg_documentdb_core
      - pg_documentdb
    parameters:
      cron.database_name: app
      documentdb.enableCompact: "true"
      documentdb.enableLetAndCollationForQueryMatch: "true"
      documentdb.enableNowSystemVariable: "true"
      documentdb.enableSortbyIdPushDownToPrimaryKey: "true"
      documentdb.enableSchemaValidation: "true"
      documentdb.enableBypassDocumentValidation: "true"
      documentdb.enableUserCrud: "true"
      documentdb.maxUserLimit: "100"
    # DocumentDB opens an internal libpq connection back to itself over
    # loopback with NO password (drop_collection and friends run their DDL
    # through it). CNPG's generated pg_hba ends in scram-sha-256, so without
    # these two rules those calls die with
    #   fe_sendauth: no password supplied / while executing command over libpq
    # Loopback only, and the pod runs exactly one customer's database with no
    # customer-reachable shell, so nothing outside the pod can use it.
    pg_hba:
      - host all all 127.0.0.1/32 trust
      - host all all ::1/128 trust
  bootstrap:
    initdb:
      # Runs in the app database as superuser — the CNPG equivalent of the
      # image's 20-install.sql (`CREATE EXTENSION documentdb CASCADE`).
      # The GRANT is ours, not the image's: the extension's API schemas are
      # owned by documentdb_admin_role, while the frontend connects as CNPG's
      # unprivileged `app` owner (deployment.yaml) — without it every call
      # fails with "permission denied for schema documentdb_api".
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS documentdb CASCADE;
        - GRANT documentdb_admin_role TO app;
  storage:
    {{/* Sized from the SAME storage.sizeGi every other engine uses — one knob,
         so RESIZE_STORAGE (values.storage.sizeGi, grow-only) works uniformly. */}}
    size: {{ .Values.storage.sizeGi }}Gi
    {{- with .Values.storage.storageClassName }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- include "database-cluster.resources" . | nindent 4 }}
  monitoring:
    enablePodMonitor: {{ .Values.monitoring.enabled }}
  # Stamp the NetworkPolicy selector label onto the backend pods too — the
  # policy covers frontend AND backend via app.kubernetes.io/instance=<id>.
  inheritedMetadata:
    labels:
      app.kubernetes.io/instance: {{ $name }}
{{- end }}
