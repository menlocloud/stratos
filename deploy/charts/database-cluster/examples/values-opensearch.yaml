---
# =============================================================================
# OpenSearch example — 3-node cluster (combined cluster_manager/data/ingest
# roles), Dashboards AND OIDC SSO enabled so CI exercises the dashboards +
# sso template legs (both are off by default). Auth: the operator mints
# <id>-admin-password itself — no stratos-owned auth secret for this engine.
#   helm template test deploy/charts/database-cluster -f examples/values-opensearch.yaml
# =============================================================================
engine: opensearch
engineVersion: "3.3.0"
instances: 3
resources:
  cpu: "2"
  memoryGi: 4
storage:
  sizeGi: 50
  storageClassName: csi-cinder-sc-delete
network:
  networkId: 11111111-2222-3333-4444-555555555555
  subnetId: 66666666-7777-8888-9999-aaaaaaaaaaaa
  memberSubnetId: bbbbbbbb-cccc-dddd-eeee-ffffffffffff
  allowedCidrs:
    - 10.50.0.0/24
stratos:
  projectId: 665f1a2b3c4d5e6f77889900
  resourceId: std-6f708192
  displayName: search-cluster
monitoring:
  enabled: false
# Customer-managed logins + a custom role — underscore names pin the '_' -> '-'
# mapping on the OpensearchUser/OpensearchRole CR names (the CR name IS the
# login/role name, prefixed with the database id).
users:
  - name: log_reader
    roles: [readall, app_logs]
opensearch:
  # Custom role referenced by log_reader above — exercises roles.yaml and the
  # users.yaml prefix resolution with the same '_' -> '-' mapping.
  roles:
    - name: app_logs
      indexPatterns: ["app-*"]
      actions: [read, search]
  parameters:
    cluster.routing.allocation.disk.watermark.low: "85%"
  dashboards:
    enabled: true
  # PUBLIC IdP client — no client secret (and no key for one).
  sso:
    enabled: true
    connectUrl: https://keycloak.example.com/realms/stratos/.well-known/openid-configuration
    clientId: opensearch-dashboards
    scope: openid profile email
    baseRedirectUrl: https://dashboards.example.com
    logoutUrl: https://dashboards.example.com/app/login
restartedAt: ""
