apiVersion: v2
appVersion: "0.1.0"
dependencies:
  - alias: addons
    condition: addons.enabled
    name: cluster-addons-menlo
    # file:// so `helm dependency build` resolves from this repo checkout —
    # no GHCR round-trip, and the vendored tgz can never drift from source.
    # The packaged chart published to GHCR embeds the subchart either way.
    repository: file://../cluster-addons-menlo
    version: 0.28.0
description: >-
  Helm chart for deploying a Kubernetes cluster on OpenStack using
  Cluster API with Kamaji as the hosted control plane provider.
  Unlike the kubeadm-based chart, the control plane runs as pods
  in the management cluster (no dedicated CP VMs needed).
name: openstack-kamaji-cluster
type: application
# 0.10.0 adds `clusterNetworking.dnsServers`: DNS servers written onto every node as a
# systemd-resolved drop-in. Until now the chart's only DNS knob was `dnsNameservers`, which CAPO
# honours ONLY on a subnet it creates itself — with a bring-your-own subnet, which is the only mode
# Stratos uses, it does nothing and nodes silently inherit whatever DNS the customer's subnet hands
# out over DHCP. CoreDNS forwards to the node resolver, so this also sets the cluster's fallback
# DNS. Written as a resolved drop-in rather than to /etc/resolv.conf: on the Ubuntu node images that
# file is a symlink into resolved's stub and DHCP rewrites it on every lease. Empty by default, so
# an existing cluster renders byte-identically and no node rolls. CHANGING it rolls EVERY worker in
# the cluster — the value lands in every pool's KubeadmConfigTemplate checksum.
# 0.9.0 adds `machineSecurityGroupIds`: extra OpenStack security groups attached to every machine
# in every node group, so a customer can bring their own groups instead of living with only the
# ones CAPO manages. ADDITIVE, not a replacement — verified against CAPO v0.14.4
# (pkg/cloud/services/networking/port.go ConstructPorts appends the managed group to the
# machine-level list), so a chosen group can widen reachability but can never lock the cluster
# out of itself. Refuses to render alongside nodeGroups[].machineNetworking.ports, where CAPO's
# semantics flip to REPLACE and the managed group would be dropped without a word. Empty by
# default, so an existing cluster upgrading to 0.9.0 renders byte-identically and no node rolls.
# CHANGING the list later changes the machine-template checksum and therefore replaces every
# worker node in the cluster.
# 0.8.0 drops the inherited registryMirrors default (a third party's quay.io namespace) — the
# chart now mirrors nothing until you configure it, so installing it never routes an operator's
# image pulls through somebody else's cache. Stratos providers set `config.cluster.registryMirrors`;
# a plain helm install sets registryMirrors in values. Upgrading an EXISTING cluster to 0.8.0
# without setting them removes its hosts.toml files and sends pulls straight at the upstream
# registries — set your own mirrors in the same change.
# 0.7.0 enables Cilium Hubble + hubble-relay by default (flow observability in every cluster).
# 0.5.0 adds clusterNetworking.disableExternalNetwork (CAPO auto-discovery opt-out for clusters
# on provider networks). 0.4.1 fixed a render bug that made every cluster unprovisionable: the
# `internalNetwork` defaults shipped `networkFilter: {id: }`, a truthy map, so the chart took the
# bring-your-own-network branch and emitted `network: {id: null}` with no subnet. Do not use 0.4.0.
version: 0.10.0
