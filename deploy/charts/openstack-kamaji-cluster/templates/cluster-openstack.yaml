---
# =============================================================================
# OpenStackCluster - Infrastructure definition for CAPO
# =============================================================================
# Kamaji owns the API server endpoint via its own LoadBalancer Service, so:
#   - apiServerLoadBalancer.enabled is hardcoded to false (CAPO must NOT
#     create a competing Octavia LB)
#   - disableAPIServerFloatingIP is hardcoded to true
#   - apiServerFixedIP is set only when .Values.apiServer.fixedIP is provided;
#     otherwise the KamajiControlPlane controller populates it after the
#     LoadBalancer Service it provisions becomes ready.
# =============================================================================
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: {{ include "openstack-kamaji-cluster.clusterName" . }}
  labels: {{ include "openstack-kamaji-cluster.labels" . | nindent 4 }}
  annotations:
    # We let Cluster API clean up this resource
    helm.sh/resource-policy: keep
spec:
  identityRef:
    name: {{ include "openstack-kamaji-cluster.cloudCredentialsSecretName" . }}
    cloudName: openstack
  {{- with .Values.clusterNetworking }}
  {{- if .manageSecurityGroups }}
  managedSecurityGroups:
    allowAllInClusterTraffic: {{ .allowAllInClusterTraffic }}
    {{- /*
      allowAllInClusterTraffic and every rule CAPO writes for in-cluster traffic match on
      remoteGroupID. In ML2/OVN that compiles to an address set built from the member ports' FIXED
      IPs — a packet whose source is a POD address matches nothing and is dropped at the receiving
      node, even though the sending port's allowedAddressPairs let it out. Cilium runs in native
      routing mode and does not masquerade traffic aimed at other cluster nodes, so every packet a
      pod sends off-node arrives carrying the pod address. The pairs (added in 0.11.0) are only the
      sending half; without these rules the receiving half still drops it, and cross-node pod
      traffic stays broken exactly as if nothing had been fixed.

      Verified on a live 2-node cluster: from a pod, cross-node pod IP and cross-node NODE IP both
      failed, while the identical destination and port from hostNetwork (source = the node's fixed
      IP) succeeded — the source address is the whole difference.

      Rules are keyed on the cluster's own CIDRs, the same kubeNetwork values that feed the pairs
      and Cilium's ipv4NativeRoutingCIDR, so the three cannot drift apart.
    */}}
    allNodesSecurityGroupRules:
      {{- range $i, $cidr := $.Values.kubeNetwork.pods.cidrBlocks }}
      - name: {{ printf "in-cluster-pod-cidr-%d" $i }}
        description: "Pod traffic from another node (Cilium native routing keeps the pod source address)"
        direction: ingress
        etherType: IPv4
        remoteIPPrefix: {{ $cidr | quote }}
      {{- end }}
      {{- range $i, $cidr := $.Values.kubeNetwork.services.cidrBlocks }}
      - name: {{ printf "in-cluster-service-cidr-%d" $i }}
        description: "Service traffic from another node"
        direction: ingress
        etherType: IPv4
        remoteIPPrefix: {{ $cidr | quote }}
      {{- end }}
      {{- with .securityGroupRules }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
  {{- end }}
  {{- if and .externalNetworkId .disableExternalNetwork }}
  {{- fail "clusterNetworking: externalNetworkId and disableExternalNetwork are mutually exclusive" }}
  {{- end }}
  {{- with .externalNetworkId }}
  externalNetwork:
    id: {{ . }}
  {{- end }}
  {{- if .disableExternalNetwork }}
  disableExternalNetwork: true
  {{- end }}
  {{- with .internalNetwork }}
  {{- /*
      Bring-your-own vs managed. The branch is decided by whether a filter actually SELECTS
      something — not merely by the key being present. `{id: }` is a truthy map with a nil id, and
      taking the BYO branch on it renders a dangling reference that CAPO cannot resolve: it will
      not create a network, will not find one, and the cluster sits unprovisioned with nothing in
      the chart output that looks wrong. Fail the render instead.
  */}}
  {{- $netSel := and .networkFilter (or .networkFilter.id .networkFilter.name .networkFilter.tags) }}
  {{- $subSel := and .subnetFilter (or .subnetFilter.id .subnetFilter.name .subnetFilter.tags) }}
  {{- if and (or .networkFilter .subnetFilter) (not (or $netSel $subSel)) }}
  {{- fail "clusterNetworking.internalNetwork: networkFilter/subnetFilter is set but selects nothing (needs id, name or tags). Leave BOTH unset to let CAPO create a per-cluster network from nodeCidr." }}
  {{- end }}
  {{- if or $netSel $subSel }}
  {{- with .networkFilter }}
  network: {{ include "openstack-kamaji-cluster.convert.neutronFilter" . | nindent 4 }}
  {{- end }}
  {{- with .subnetFilter }}
  subnets:
    - {{ include "openstack-kamaji-cluster.convert.neutronFilter" . | nindent 6 }}
  {{- end }}
  {{- else }}
  managedSubnets:
    - cidr: {{ .nodeCidr }}
      {{- with (default $.Values.clusterNetworking.dnsNameservers .dnsNameservers) }}
      dnsNameservers: {{ toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  # =========================================================================
  # Kamaji-specific: DISABLE OpenStack API server load balancer
  # The KamajiControlPlane creates its own LoadBalancer Service for the
  # API server endpoint. CAPO must NOT create a competing one.
  # =========================================================================
  apiServerLoadBalancer:
    enabled: false
  disableAPIServerFloatingIP: true
  {{- with .Values.apiServer.fixedIP }}
  apiServerFixedIP: {{ . }}
  {{- end }}
  apiServerPort: {{ .Values.apiServer.port }}
