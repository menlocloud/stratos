apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "openstack-kamaji-cluster.componentName" (list . "autoscaler") }}
  labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "autoscaler") | nindent 4 }}
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machinedeployments
      - machines
      - machinesets
      - machinepools
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machinedeployments/scale
    verbs:
      - get
      - patch
      - update
  # Cluster-autoscaler clusterapi provider also reads the infra template
  # (OpenStackMachineTemplate) referenced by each MachineDeployment so it
  # can synthesise node objects for scale-up calculations. Read-only.
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - openstackmachinetemplates
    verbs:
      - get
      - list
      - watch
