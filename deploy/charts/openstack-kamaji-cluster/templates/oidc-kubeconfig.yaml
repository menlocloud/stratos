{{- $kc := .Values.kamajiControlPlane.endUserKubeconfig | default dict }}
{{- $oidc := include "openstack-kamaji-cluster.oidc.resolve" . | fromYaml }}
{{- if and $kc.enabled $oidc.issuerUrl }}
{{- if not $kc.serverUrl }}{{- fail "kamajiControlPlane.endUserKubeconfig.serverUrl is required when endUserKubeconfig.enabled=true" }}{{- end }}
{{- $clusterName := $kc.clusterName | default .Release.Name }}
{{- $contextName := $kc.contextName | default (printf "%s-oidc" .Release.Name) }}
{{- $userName := $kc.userName | default "oidc-user" }}
{{- $scopes := $kc.extraScopes | default (list "email" "profile" "groups") }}
{{- $cmName := $kc.configMapName | default (printf "%s-oidc-kubeconfig" .Release.Name) }}
{{- $caSecret := $kc.caSecretName | default (printf "%s-kamaji-cp-ca" .Release.Name) }}
{{- $jobImage := $kc.jobImage | default "docker.io/bitnami/kubectl:latest" }}
{{- $sa := printf "%s-oidc-kubeconfig" .Release.Name | trunc 63 | trimSuffix "-" }}

{{- /* --------------------------------------------------------------------
       Mode A: insecure-skip-tls-verify — render ConfigMap directly via
       Helm, no Job, no Kamaji CA lookup. Acceptable on trusted networks.
       -------------------------------------------------------------------- */}}
{{- if $kc.insecureSkipTLSVerify }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cmName }}
  labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "oidc-kubeconfig") | nindent 4 }}
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: {{ $clusterName }}
        cluster:
          server: {{ $kc.serverUrl }}
          insecure-skip-tls-verify: true
    contexts:
      - name: {{ $contextName }}
        context:
          cluster: {{ $clusterName }}
          user: {{ $userName }}
    users:
      - name: {{ $userName }}
        user:
          exec:
            apiVersion: client.authentication.k8s.io/v1
            command: kubectl
            args:
              - oidc-login
              - get-token
              - --oidc-issuer-url={{ $oidc.issuerUrl }}
              - --oidc-client-id={{ $oidc.clientId }}
{{- range $scope := $scopes }}
              - --oidc-extra-scope={{ $scope }}
{{- end }}
            interactiveMode: IfAvailable
    current-context: {{ $contextName }}

{{- else }}
{{- /* --------------------------------------------------------------------
       Mode B: auto-embed Kamaji CA via post-sync Job. Job waits for the
       Kamaji-generated `<release>-kamaji-cp-ca` Secret, reads ca.crt, then
       creates/patches the kubeconfig ConfigMap with certificate-authority-
       data set. Idempotent — re-runs on every chart upgrade so CA rotation
       eventually propagates.
       -------------------------------------------------------------------- */}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "oidc-kubeconfig") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}
  labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "oidc-kubeconfig") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, watch]
    resourceNames: [{{ $caSecret | quote }}]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}
  labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "oidc-kubeconfig") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $sa }}
  labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "oidc-kubeconfig") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 30
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{ include "openstack-kamaji-cluster.componentLabels" (list . "oidc-kubeconfig") | nindent 8 }}
    spec:
      serviceAccountName: {{ $sa }}
      restartPolicy: OnFailure
      containers:
        - name: render
          image: {{ $jobImage }}
          imagePullPolicy: IfNotPresent
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: SECRET_NAME
              value: {{ $caSecret | quote }}
            - name: CM_NAME
              value: {{ $cmName | quote }}
            - name: SERVER_URL
              value: {{ $kc.serverUrl | quote }}
            - name: CLUSTER_NAME
              value: {{ $clusterName | quote }}
            - name: CONTEXT_NAME
              value: {{ $contextName | quote }}
            - name: USER_NAME
              value: {{ $userName | quote }}
            - name: OIDC_ISSUER
              value: {{ $oidc.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $oidc.clientId | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              echo "Waiting for Kamaji CA Secret $NAMESPACE/$SECRET_NAME ..."
              i=0
              while [ $i -lt 60 ]; do
                if kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null 2>&1; then
                  break
                fi
                i=$((i+1))
                sleep 10
              done
              kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" >/dev/null
              CA_B64=$(kubectl -n "$NAMESPACE" get secret "$SECRET_NAME" -o jsonpath='{.data.ca\.crt}')
              if [ -z "$CA_B64" ]; then
                echo "ca.crt missing in Secret $SECRET_NAME" >&2
                exit 1
              fi

              cat >/tmp/kc.yaml <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: $CLUSTER_NAME
                  cluster:
                    server: $SERVER_URL
                    certificate-authority-data: $CA_B64
              contexts:
                - name: $CONTEXT_NAME
                  context:
                    cluster: $CLUSTER_NAME
                    user: $USER_NAME
              users:
                - name: $USER_NAME
                  user:
                    exec:
                      apiVersion: client.authentication.k8s.io/v1
                      command: kubectl
                      args:
                        - oidc-login
                        - get-token
                        - --oidc-issuer-url=$OIDC_ISSUER
                        - --oidc-client-id=$OIDC_CLIENT_ID
              {{- range $scope := $scopes }}
                        - --oidc-extra-scope={{ $scope }}
              {{- end }}
                      interactiveMode: IfAvailable
              current-context: $CONTEXT_NAME
              EOF

              kubectl -n "$NAMESPACE" create configmap "$CM_NAME" \
                --from-file=kubeconfig=/tmp/kc.yaml \
                --dry-run=client -o yaml | kubectl apply -f -
              echo "Rendered ConfigMap $NAMESPACE/$CM_NAME with embedded CA"
{{- end }}
{{- end }}
